[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scroi"
version = "0.1.0"
description = "Supply chain automation ROI model: NPV/IRR/payback, sensitivity analysis, and budget/space-constrained portfolio optimisation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "numpy-financial>=1.0",
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scroi = "scroi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
